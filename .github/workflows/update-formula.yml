name: Update Homebrew cask on release

# Fires whenever a GitHub Release is published with a Record-<version>.zip
# asset (created by scripts/tag-release.sh). Rewrites Casks/record.rb in
# charsree/homebrew-tools with the new url + sha256 so users pick it up
# with `brew upgrade --cask record`.
#
# ONE-TIME SETUP: create a fine-grained Personal Access Token with
# Contents: Read and write on charsree/homebrew-tools, and store it as
# the TAP_TOKEN secret on this repo.

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait a moment for the zip asset to fully propagate
        run: sleep 5

      - name: Compute SHA256 of the release zip
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          asset="https://github.com/${REPO}/releases/download/${REF}/Record-${VERSION}.zip"
          echo "Fetching $asset"
          curl -sfL "$asset" -o Record.zip
          sha=$(sha256sum Record.zip | awk '{print $1}')
          echo "value=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA256: $sha ($(du -h Record.zip | awk '{print $1}'))"

      - name: Checkout homebrew-tools
        uses: actions/checkout@v4
        with:
          repository: charsree/homebrew-tools
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tools

      - name: Rewrite Casks/record.rb
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.sha.outputs.value }}
        run: |
          mkdir -p homebrew-tools/Casks
          # Also delete any legacy Formula version that used to live here.
          rm -f homebrew-tools/Formula/record.rb
          cat > homebrew-tools/Casks/record.rb <<EOF
          cask "record" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/charsree/record/releases/download/v#{version}/Record-#{version}.zip"
            name "Record"
            desc "Local-first macOS meeting assistant with mic, system audio, screen OCR, and Kiro chat"
            homepage "https://github.com/charsree/record"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates false

            app "Record.app"

            # Convenience CLI: \`record\` in Terminal launches the installed app.
            binary "#{staged_path}/record-shim", target: "record"

            preflight do
              File.write("#{staged_path}/record-shim", <<~SH)
                #!/bin/sh
                exec open -a "Record" "\\\$@"
              SH
              File.chmod(0755, "#{staged_path}/record-shim")
            end

            zap trash: [
              "~/Library/Application Support/Record",
              "~/Library/Preferences/dev.charsree.record.plist",
              "~/Library/Saved Application State/dev.charsree.record.savedState",
            ]

            caveats <<~EOS
              Record was installed to /Applications/Record.app.

              Launch it:
                open -a Record        # or just: record

              First launch asks for Microphone + Screen Recording. Grant both —
              system audio (Zoom/Meet/Teams/etc.) needs Screen Recording.

              Pick a whisper model in Preferences → Transcription.
              large-v3-turbo is best; base.en is smallest / fastest.

              Optional: install the Kiro CLI (https://kiro.dev) for chat, auto-title,
              and auto-summary. Recording + transcription work without it.

              All meeting data stays on your Mac, encrypted with AES-GCM at:
                ~/Library/Application Support/Record/
            EOS
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tools
        run: |
          git config user.name "record-release-bot"
          git config user.email "actions@github.com"
          git add -A Casks/record.rb Formula/record.rb 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "record: bump to ${{ steps.version.outputs.value }}

          Automated by the charsree/record release workflow."
          git push
