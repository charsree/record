name: Update Homebrew formula on release

# Fires whenever a `v*` tag is pushed AND the corresponding GitHub
# Release with a Record-<version>.zip asset exists (created by
# scripts/tag-release.sh). Rewrites Formula/record.rb in
# charsree/homebrew-tools with the new url + sha256.
#
# ONE-TIME SETUP (once):
#   1. Create a fine-grained Personal Access Token:
#      https://github.com/settings/personal-access-tokens/new
#      • Resource owner: charsree
#      • Repository access → Only select repositories → charsree/homebrew-tools
#      • Repository permissions → Contents: Read and write
#   2. Add it as a repo secret on charsree/record:
#      • Name:  TAP_TOKEN
#      • Value: the PAT

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait a moment for the zip asset to fully propagate
        run: sleep 5

      - name: Compute SHA256 of the release zip
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          asset="https://github.com/${REPO}/releases/download/${REF}/Record-${VERSION}.zip"
          echo "Fetching $asset"
          curl -sfL "$asset" -o Record.zip
          sha=$(sha256sum Record.zip | awk '{print $1}')
          size=$(du -h Record.zip | awk '{print $1}')
          echo "value=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA256: $sha (size: $size)"

      - name: Checkout homebrew-tools
        uses: actions/checkout@v4
        with:
          repository: charsree/homebrew-tools
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tools

      - name: Rewrite Formula/record.rb
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.sha.outputs.value }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          cat > homebrew-tools/Formula/record.rb <<EOF
          class Record < Formula
            desc "Local-first macOS meeting assistant with mic, system audio, screen OCR, and Kiro chat"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/${REF}/Record-${VERSION}.zip"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "MIT"

            depends_on :macos

            def install
              # Pre-built .app bundle sits at the archive root because
              # tag-release.sh zipped it with `ditto --keepParent`.
              prefix.install "Record.app"

              # Auto-install into /Applications so Launchpad / Spotlight
              # / TCC treat it like any drag-installed app. Falls back to
              # a caveats note when /Applications isn't writable.
              applications = "/Applications"
              if File.writable?(applications)
                rm_rf "#{applications}/Record.app"
                cp_r "#{prefix}/Record.app", "#{applications}/Record.app"
              end

              # \`record\` in Terminal opens the app.
              (bin/"record").write <<~SH
                #!/bin/sh
                exec open -a "Record" "\\\$@"
              SH
              chmod 0755, bin/"record"
            end

            def caveats
              if File.exist?("/Applications/Record.app")
                <<~EOS
                  Record was installed to /Applications/Record.app.

                  Launch it:
                    open -a Record        # or just: record

                  First launch asks for Microphone + Screen Recording. Grant both —
                  system audio (Zoom/Meet/Teams/etc.) needs Screen Recording.

                  Pick a whisper model in Preferences → Transcription.
                  large-v3-turbo is best; base.en is smallest / fastest.

                  Optional: install the Kiro CLI (https://kiro.dev) for chat,
                  auto-title, and auto-summary. Recording + transcription work
                  without it.

                  Data stays local, AES-GCM encrypted at
                  ~/Library/Application Support/Record/.
                EOS
              else
                <<~EOS
                  Record has been installed to:
                    #{prefix}/Record.app

                  We couldn't auto-copy it to /Applications (permission denied).
                  Move it manually:
                    cp -R #{prefix}/Record.app /Applications/
                    open -a Record
                EOS
              end
            end

            test do
              assert_predicate prefix/"Record.app", :exist?
              assert_predicate prefix/"Record.app/Contents/MacOS/Record", :executable?
            end
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tools
        run: |
          git config user.name "record-release-bot"
          git config user.email "actions@github.com"
          if git diff --quiet Formula/record.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/record.rb
          git commit -m "record: bump to ${{ steps.version.outputs.value }}

          Automated by the charsree/record release workflow."
          git push
