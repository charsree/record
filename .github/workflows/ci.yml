name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # macos-15 ships Xcode 16.x with Swift 6+. macos-14 is still on
    # Swift 5.10 which can't parse a swift-tools-version:6.2 Package.swift.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install dependencies
        run: brew install whisper-cpp sqlite

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
